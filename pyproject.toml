[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hazard-demo"
version = "0.1.0"
description = "A hazard detection app using LLaVA and Streamlit"
readme = "README.md"
requires-python = ">=3.11.11"
authors = [
    { name = "Stephanie Ng", email = "szng@swin.edu.au" }
]
dependencies = [
    "ollama==0.4.7",
    "openai==1.72.0",
    "streamlit==1.45.1",
    "requests==2.32.2",
    "Pillow==9.0.1",
    "json_repair==0.41.0",
    "selenium==4.32.0",
    "webdriver-manager==4.0.2",
    "torch==2.1.2",
    "torchvision==0.16.2",
    "transformers==4.37.2",
    "tokenizers==0.15.1",
    "sentencepiece==0.1.99",
    "shortuuid==1.0.13",
    "accelerate==0.21.0",
    "peft==0.13.2",
    "bitsandbytes==0.42.0",
    "pydantic==2.11.3",
    "markdown2==2.5.3",
    "numpy==1.26.4",
    "scikit-learn==1.2.2",
    "gradio==4.16.0",
    "gradio_client==0.8.1",
    "requests==2.32.2",
    "httpx==0.27.0",
    "uvicorn==0.34.2",
    "fastapi==0.115.12",
    "einops==0.6.1",
    "einops-exts==0.0.4",
    "timm==0.6.13",
]
